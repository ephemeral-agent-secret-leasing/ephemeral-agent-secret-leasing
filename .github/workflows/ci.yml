name: ci

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install benchmark
        run: python -m pip install "zero-trust-agent-benchmark @ git+https://github.com/zero-trust-agent-benchmark/zero-trust-agent-benchmark@v0.1.0"
      - run: bash scripts/check.sh

  vault-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install benchmark
        run: python -m pip install "zero-trust-agent-benchmark @ git+https://github.com/zero-trust-agent-benchmark/zero-trust-agent-benchmark@v0.1.0"
      - name: Install package
        run: python -m pip install -e ".[dev]"
      - name: Start Vault
        run: |
          docker run --rm -d --name ephemeral-agent-secret-leasing-vault \
            -p 18420:8200 \
            -e VAULT_DEV_ROOT_TOKEN_ID=root \
            -e VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200 \
            hashicorp/vault:1.21
          for i in {1..30}; do
            if curl -sf http://127.0.0.1:18420/v1/sys/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs ephemeral-agent-secret-leasing-vault
          exit 1
      - name: Run Vault integration test
        env:
          ZTAP_INTEGRATION: '1'
          VAULT_ADDR: http://127.0.0.1:18420
          VAULT_TOKEN: root
        run: pytest tests/test_integration_vault.py -q
