[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"
[project]
name = "ephemeral-agent-secret-leasing"
version = "0.1.0"
description = "Short-lived, identity-bound secret leases for AI agents"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Parag Sawant" }]
dependencies = [
  "cryptography==50.0.1; sys_platform != 'win32' or platform_machine != 'ARM64'",
  "cryptography==46.0.3; sys_platform == 'win32' and platform_machine == 'ARM64'",
  "pyyaml>=6",
  "starlette>=0.40",
  "uvicorn>=0.30",
  "hvac>=2.4",
]
[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "hypothesis>=6.112", "ruff>=0.8", "mypy>=1.13", "httpx>=0.27", "types-PyYAML>=6"]
[project.scripts]
ephemeral-agent-secret-leasing = "ephemeral_agent_secret_leasing.cli:main"
[project.urls]
Homepage = "https://github.com/ephemeral-agent-secret-leasing/ephemeral-agent-secret-leasing"
Issues = "https://github.com/ephemeral-agent-secret-leasing/ephemeral-agent-secret-leasing/issues"
[tool.hatch.build.targets.wheel]
packages = ["src/ephemeral_agent_secret_leasing"]
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/ephemeral_agent_secret_leasing/stats.py"]
[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]
"bench/**" = ["S101", "S105", "S106", "S311", "T201"]
"src/ephemeral_agent_secret_leasing/stats.py" = ["S311", "E231", "E501", "RUF022"]
[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]
[[tool.mypy.overrides]]
module = "hvac"
ignore_missing_imports = true
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: needs external services (set ZTAP_INTEGRATION=1)"]
[tool.coverage.run]
branch = true
source = ["ephemeral_agent_secret_leasing"]
omit = ["src/ephemeral_agent_secret_leasing/stats.py"]
[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:", "raise NotImplementedError"]


[[tool.mypy.overrides]]
module = "zero_trust_agent_benchmark"
ignore_missing_imports = true
